<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 위치요소를 조정할 수 있는데 부모요소 대비 시작요소 absolute */
        .box {
            width: 200px;
            height: 200px;
        }


        .red-box {
            background-color: red;
            position: relative;
            left: 100px;
        }
 /* 위치요소를 조정할 수 있는데 부모요소대비에서 시작
 부모요소 중에 위치조정 가능한 경우가 있을 이동가능 absolute */
        .green-box {
            background-color: green;
            position: absolute;
            left: 50px;
            top: 50px;

        }

        .blue-box {
            background-color: blue;
        }
        .container{
            background-color: rgb(173, 24, 196);
            position: relative;
        }
    </style>

</head>

<body>

        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="box blue-box"></div>
    <div class="container">
    <!--"container" 위치조정이 가능하지 않는다. -->
        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="box blue-box"></div>
</div>
</body>

</html>

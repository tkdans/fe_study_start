<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            animation-name: box-ani1;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-fill-mode: both;
            /* animation-iteration-count: 3; */
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-play-state: running;

        }
.box:hover{
    /*animation-play-state 효과의 특징  */
    animation-play-state: paused;
}
        @keyframes box-ani1 {

            /* 순차적으로 정의 */
            0% {
                background-color: red;
                width: 200px;
            opacity: 1;
            }

            50% {
                background-color: green;
                width: 300px;
                opacity: 0.6;
            
            }

            100% {
                background-color: blue;
                width: 500px;
                opacity: 0.2;
            }
        }

        @keyframes box-ani2 {

            /* 순차적으로 정의 */
            0% {
                background-color: red;
                width: 200px;
            }

            25% {
                background-color: rgb(221, 28, 198);
                width: 200px;
            }

            50% {
                background-color: green;
                width: 300ㅔㅌ;
            }

            75% {
                background-color: red;
                width: 200px;
            }

            100% {
                background-color: blue;
                width: 500px;
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 아이콘의 크기 조절은 text 속성으로 조걸한다. */
.fa-solid fa-poo{
   text-size: 50px;
}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- 인식이 되려면 class명에 스타일이 있어야 한다.
      라이브러리 (내가 필요한 기능이 외부에 기능이나 목적에 맞게 이미 만들어 있다.)
      아이콘 세팅을 해줘야 한다. cdnjs 사이트에 들어가 font-awesome 주소를 복사해서</>로 사용한다. 
      사용법은 font-awesome에 있다라는 식이다, 프리-->
    <i class="fa-solid fa-comment"></i>
    <i class="fa-solid fa-image"  style="font-size: 100px;"></i> 
    <!-- 아이콘 크기를 font-size룰 자정하면 사이즈 조정이 가능하다. -->
    <i class="fa-solid fa-cloud"></i>
    <i class="fa-solid fa-poo"></i>

</body>
</html>

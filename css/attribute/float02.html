<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 * {
            margin: 0;
            /*외부여백 0*/
            padding: 0;
            /*내부여백 0*/
            box-sizing: border-box;
            /*박스모델에 사이즈를 지정하면 border까지 사이즈 자동 설정*/
        }
.box {
    width: 200px; height: 200px;
    }
    .black-box {
        /*  */
        border: 2px solid black;
        display: inline-block;
    }
    /* float눈 공중에 떠있어서 다음에 있는요소가 그자리를 차지하여 안보이게 된다
    하지만 다음요소에도 float를 부여하면 같이 떠 있는 것으로 인식하고 옆으로 붙는다 */
.red-box{background-color: red;
float: left;
}

.green-box {background-color: green;
float: left;
}
.blue-box{background-color: blue;
float: left;
}
.box-next{background-color: gray;

}
.clear-box{
    clear: both;
} 
/* .container::after{
    content: ""; /*content가 없으면 작동을 안해서 필수로 입력*/
    display: block;/*content 기본 텍스트 inline->block 변경*/
    clear: both; /*float자리에 clear처리*/
} */
/*float로 공중에 뜬 상태로 공간/위치 인식이 안될때 해려방법
1.그 크기만큼 차지하는공간에 임의에 요소를 배치한다.
2.clear라는 요소를 사용
    1)styl에서 float가 적용된 요소 중 가장 끝 요소의 다음 요소에 적용
    2)가상요소 선택자 clear
* 그밖에 부모사이즈 요소와 자식 사이즈 요소에 부모요소 사이즈가 있다면 자식요소는 무시하고 넘쳐버린다.
그래서 overflow: strol로 넘치지 않게 하도록 존재한다.  
만약에 부모 크기가 정홰져 있지 않으면 내가 보유한 자식들 (크기만큼) 사이즈만큼 차지한다.
        - 특정한 사이즈를 주고 싶다면 부모요소에 사이즈를 부여하면 된다.
        - 자식요소사이즈가 어느정도인지 모르겠다면 부모요소 사이즈를 지정하지 않으면 된다.
  */

    </style>
</head>
<body>
    <div class="box black-box">
         
    <!-- 띄어쓰기가 되어 있는거다 -->
     <!-- &nbsp; 띄어쓰기 명령어 -->
    </div><div class="box black-box"> 
        <!--</div><div> 박스사이에 공백이 없다.
            html에서 가로배치가 기본이라서  -->
    </div><div class="box black-box"> </div>
<!-- float 사용시 주의사항 -->
    <div class="container">
        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="box blue-box"></div>
          <div class="clear-box"></div>
           <!-- clear 태그는 float의 맨 밑 문장아래에 존재해야한다. -->
        <!-- <div class="clear-box"></div> -->
    </div>
    <!-- <div class="clear-box"></div> -->
<!-- <div class="box"></div> -->
    <div class="box box-next" ></div>
</body>
</html>

<head>

            background-image: url(../../HTML/bal.png);
            background-repeat:no-repeat;

            background-position: left bottom;
        }

</head>
<body>
    <div class="box back"></div>
    <!-- 동일한 class에 여러개의 속성을 줄 수 있다. 
     밑-->

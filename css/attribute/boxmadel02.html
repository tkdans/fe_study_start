<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        //* 전체선택자 모든 요소에 기본 세팅 적용 */
        /* 모든 기본적인 세팅 
        여백이 없이 세팅하고 하자~!*/
        * {
            margin: 0;
            /*외부여백 0*/
            padding: 0;
            /*내부여백 0*/
            box-sizing: border-box;
            /*박스모델에 사이즈를 지정하면 border까지 사이즈 자동 설정*/
        }

        /*
        dispaly 속성
        none       : 표시 X
        black      : 한줄 다 차지, 사이즈도 적용가능 (wiwth, height)적용 가능, 여백 가능
        inline     : 컨텐츠 사이즈만큼만 차지, 같은 줄 옆에 나란히 배치. 사이즈 적용 X, 여백 적용(좌,우)
        inline-block: 자체적으로는 block 처럼(사이즈, 여백을 줄 수 있다....)
                    : 외부적으로는 inline 처럼(다른 요소와 상호작용 할 때, 나란히 배치)
        */
        .box1 {
            /*div 태그 기본 block*/
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;
            /* 화면에 안보이게 한다. */
            /* display: none; */
        }

        .box2
{ /*div 태그 기본 block*/
        width: 200px;
        height: 100px;
        border: 1px solid black;

        margin: 10px;
        padding: 10px;
        /* display: block. */
        display: block}  
        .box2:hover{
            display: inline-block;
            width: 180px;
height: 80px;
        }     
        /* .box3{ */
        /*display: inline
        width: 200px;
        height: 100px;
        border: 1px solid black;

        margin: 10px;
        padding: 10px;
               display: inline;
        }*/
        .box3{
        /*div 태그 기본 block*/
        width: 200px;
        height: 100px;
        border: 1px solid black;

        margin: 10px;
        padding: 10px;
        /* 화면에 안보이게 한다. */
        display: inline-block;
        }
        /* 블록으로 바꿘 것 block,  */
        .span1{
            display: inline;
            width: 200px;
            height: 100px;
        }
        .parent {
            width: 200px;
            height: 100px;
            border: 1px solid blue;

        }
        .child{
            width: 100px;
            height: 50px;
            border: 1px solid red;
        display: none;
        }
        .parent:hover .child {
            /* 마우스가 올라간 perent가 있으면 child에 문구가 보인다 */
            display: block;
        }

    </style>

</head>

<body>

    <div class="box1">box1 </div>
    <div class="box2">box2 </div>
    <div class="box3">box3 </div>
    <div class="span1">span1 </div>
    <span>Lorem ipsum dolor sit amet consectetur adipisicing elit. A voluptate tempora doloribus doloremque fugit
        dolorem numquam perferendis nam nulla harum ullam, dolorum eius natus exercitationem nesciunt vel sint mollitia
        assumenda? </span>



        <div class="parent">
            부모
            <div class="child">
                자식
            </div>
        </div>
</body>

</html>

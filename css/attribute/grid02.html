<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: 100px 100px 100px;
            grid-template-areas:
                "header header header"
                "sideber content content"
                "footar footer footer"
            ;
        }

        #header {
            background-color: orange;
            grid-area: header;
        }

        #sidebar {
            background-color: lightskyblue;
            grid-area: sidebar;
        }
        #content {
            background-color: lightgreen;
            grid-area: content;

        }
        #footer {
            background-color: blueviolet;
            grid-area: footer;
        }
    </style>

</head>

<body>

    <div class="container">
        <div id="header"></div>
        <div id="sideber"></div>
        <div id="content"></div>
        <div id="footer"></div>

    </div>
</body>

</html>

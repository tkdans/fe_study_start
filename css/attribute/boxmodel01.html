<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            /*외부여백, 4가지 방향으로 적용*/
            margin: 30px;
            /*border경걔선*/
            border: 2px solid blue;
            /*내부여백*/
            padding: 15px;
            width: 200px;
            height: 150px;
        }
        .box2{
            /* margin 속성 입력 두방향 */
            /* margin-top: 50px; */
            /* margin-bottom: 100px; */
            /*여백을 설정하는 표기법은 여러가지가 있다.*/
            margin: 50px 100px;
            /* border: 2px solid red; */
            border-width: 2px;
            border-style: dashed;
            border-color: red;
            /*padding 유형*/
            padding-left: 30;
            padding-top: 3rem;
            width: 200px;
            height: 150px;
/*box-sizeing 다른 속성에 영향을 많이 받는다.사이즈 지정이 어렵다.*/
box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1">
        box1

    </div>
      <div class="box2">
        box2

    </div>
    <p>asdfasd13213</p>
</body>
</html>

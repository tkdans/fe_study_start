<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .class {
                        display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: center;
            color: white;
            
            
        }

        .header {
            width: 700px;
            height: 100px;
            display: flex;
            justify-content: space-between;
            
        }

        .header1 {
            width: 25%;
            background-color: red;
        }

        .header2 {
            width: 15%;
            background-color: red;
        }

        .body {
            width: 700px;
            height: 300px;
            display: flex;
            justify-content: space-between;
        }

        .body1 {
            width: 70%;
            background-color: yellow;
            transition-property: all;
            transition-duration: 1s;
        }

        .aside {
            width: 30%;
            background-color: green;
        }

        .footer {
            height: 100px;
            width: 700px;
            background-color: blue;
        }
        .box{
            width: 100px;
            height: 50px;
            background-color: black;
            margin: 30px;
            margin-top: 50px;
            box-sizing: border-box;
            display: inline-block;
        }
        .box:hover{
            transform: scale(1.5);
        }
    </style>
</head>

<body>
    <div class="class">
        <div class="header">
            <div class="header1">메인메뉴</div>
            <div class="header2">마이페이지</div>
        </div>
        <div class="body">
            <div class="body1">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="aside">aside</div>
        </div>
        <div class="footer">footer</div>
    </div>
</body>

</html>

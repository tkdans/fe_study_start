<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 제출하지 못쌨음..ㅜㅜ
     박스 정렬을 하기 위해서 margin을 퀴즈 -->
    <style>
        {
            /* 전체선택자 모든 요소에 기본 세팅 적용 */
            /* 모든 기본적인 세팅 
        여백이 없이 세팅하고 하자~!*/
            margin: 0;
            /*외부여백 0*/
            padding: 0;
            /*내부여백 0*/
            box-sizing: border-box;
            /*박스모델에 사이즈를 지정하면 border까지 사이즈 자동 설정*/
        }

        .box1 {
            width: 200px;
            height: 100px;
            border: 1px solid green;
            margin: 50px;
            display: inline-block
            }
        .title{
            font-size: 40px;
            font-weight: bold;
        }
span{
    font-size: 30px;
    font-weight: 700;
}
        /*div 태그 기본 block*/
    </style>


</head>

<body>
    <h1>박스 정렬</h1>
    <p class="title">123</p>
    <div class="box1"></div>
    <div class="box1"></div>
    <div class="box1"></div>
    <div class="box1"></div>
    <div class="box1"></div>
    <div class="box1"></div>

</body>

</html>

        * {

        .container {
            width: 500px;

            margin: 0 auto;
            margin-top: 50px;

        }

       /* }

        .red-box{
            width: 250px;
            height: 100px;
            background-color: red;
            float: left;
        }
        .green-box{
            width: 250px;
            height: 100px;
            background-color: green;
            float: left;
        }
        .main{
            text-align: center;
            
            }
        .blue-box{
            width: 500px;
            height: 200px;
            background-color: blue;
            float: left;
        }
        /*float 사용시 마지막에는 무조건 clear*/
        .container::after{
            counter:"" ;
            display: block;
            clear: both;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="red-box">
        </div><div class="green-box"></div>
        <div class="main">

        </div>
        <div class="blue-box"></div>
    </div>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 700px;
            height: 500px;
            margin: 0 auto;
            margin-top: 50px;
            background-color: white;
            border: 1px solid black;
        }

        /*------------상당 header스타일 시작 -----------  */
        .header {
            height: 100px;
            display: flex;
            justify-content: space-between;
        }

        .main-menu {
            background-color: red;
            width: 200px;
            height: 100%;
        }

        .mypage {
            background-color: red;
            width: 100px;
            height: 100%;
        }

        /*------------상당 header스타일 끝 -----------  */

        /* 가운데 정렬 align-center */
        .align-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .color-white {
            color: white;
        }

        /*------------가운데 main영역     스타일 시작 -----------  */
        .nmain {
            width: 700px;
            background-color: lightskyblue;
            display: flex;
        }

        .section {
            width: 70%;
            height: 300px;
            background-color: orange;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            /* justify-content: space-evenly;  가로줄  맞춤 빈 여백 간격 */
            align-content: center;
            /* align-items: center 세로 줄 맞춤 */


        }

        .article {
            width: 100px;
            height: 50px;
            background-color: black;
                        margin: 30px;
            /* transition-property: all;
transition-duration: 0.5s;는 마우스를 올렸다가 띄우면 자연스럽게 원위치가 된다  */
            transition-property: all;
            transition-duration: 0.5s;
        }

        .article:hover {
            /* width: 140px;
height: 50px;
margin: 10px; */
            transform: scale(1.5);
            /* x축 크기 y축 크기 사이즈 커짐*/
        }

        .aside {
            width: 30%;
            height: 300px;
            background-color: green;
            display: flex;
            flex-wrap: wrap;
        }

        .footer {
            background-color: blue;
            height: 100px;

        }






        /*------------가운데 main영역     스타일 끝 -----------  */
        /*  */
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="main-menu align-center color-white">메인메뉴</div>
            <div class="mypage align-center color-white">마이메뉴</div>
        </div>
        <div class="main">
            <div class="section ">
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
                <div class="article"></div>
            </div>
            <div class="aside align-center color-white">aside</div>
        </div>
        <div class="tooter align-center color-white">footer</div>
    </div>
</body>

</html>

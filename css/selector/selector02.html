<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*그룸 선택자 ,로
        실제로 안 좋은 선택*/
        p,strong{color: red;}
        /* strong {color:  red;}*/
        /*자식 선택자
        부모선택자와 자식선택자 >로 구분한다. */ 
       /* .top-div > p {color: green;}*/
        /* 1. 하위선택자
        공백으로 선택자가 된다*/
       /* .top-div p {color: green;}
        .top-div span {color: purple;} 
    /*하위 선택자와 span태그 중 어느게 적용될까*/
        /*span {color: aqua}*/
        /*인접 형제 선택자 +,
         첫번째 선택자 바로 옆에 인접한 선택자로 
        조건에 만족하는 것들만 적용한다.  
        */
       /* p+span{color: aqua;}*/
        /* 일반 형제 선택자*/
        p~span{color: aqua;}
        /*가상 요소 선택자*/
        #vr-p::before{
            content: "***";
            color: aqua;
        }
        #vr-p::before {
            content: "...";
            color: brown;
        }
        /*가상클래스 선택자
        방문했는지 구분해주는 것 */
    a:link {color: pink;}
    a:visited{color: crimson;}
    /* 동적 가상 클래스 선택자*/
    a:hover{color: aqua;}
    a:active{color: green;}
    /*입력요소 가상 클래스 선택자*/
    input:focus{color: red;}
    input:disabled {color: darkslategray;}
    /*입력요소의 조건으로 조합*/
    .chk:checked + span{color: blue;}
    .chk:checked + label{color: green;}


        </style>


</head>
<body>
    <div class="top-div">
        <p>p1</p>
        <p>p2</p>
        <span>span1</span>
        <span>span2</span>

        <div>
            <p>p3</p>
            <p id="vr-p">p4</p>
            <strong>strong</strong>
            <span>span3</span>
        </div>

        <div>
            <strong>strong2</strong>
            <span>span4</span>
        </div>

    </div>

    <p>p5</p>

    <a href="https://www.samsungsvc.co.kr/">삼성서비스</a>
    <a href="https://www.lge.co.kr/">LG전자</a>
    <a href="https://www.naver.com">네이버</a>

    <br><br>

    <input type="text" value="input1 value"> <br>
    <input type="text" value="input1 value" disabled> <br>

    <br>

    <input type="checkbox" class="chk"><span>출근</span><br>
    <input type="checkbox" class="chk"><span>퇴근</span><br>

    <input type="checkbox" class="chk" id="retire"><label for="retire">조퇴</label><br>
    <label>
        <input type="checkbox" class="chk"><span>조퇴</span>
    </label><br>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--테이블 만들기 위해서 cs코드가 필요하다 -->
        <style>
        table, th, td {
        border:1px solid black;
        border-collapse: collapse;
        }
        </style>
</head>
<body>
       <table>
        <!--한개 행은 tr
        한개 역 th, td-->
        <thead>
        <tr>
            <th>지역구분</th>
            <th colspan="2">지역명</th>
        </tr>
        <tr>
            <td rowspan="2">서울</td>
            <td>강남</td>
            <td>서초</td>
                            </tr>
        <tr>
            <!-- <td>서울</td>이렇게 하는 방법을 몰랐음 -->
            <td>잠실</td>
            <td>송파</td>
    
        </tr>
         <tr>
            <td rowspan="2">천안</td>
            <td>봉명</td>
            <td>쌍용</td>
        </tr>
          <tr>
            <!-- <td>천안</td> -->
            <td>신부</td>
            <td>두정</td>
        </tr>
        </table>
        <br><br><br>
        <table>
            <!--처음 만들 행을 계산하여 tr태그를 만든다.-->
         <tr>
            <th rowspan="2">식당명 </th>
            <th colspan="2">영업시간</th>
            <th rowspan="2">메뉴</th>
        </tr>
        <tr>
            <!-- <th>식당명 </th> -->
            <th>시작시간</th>
            <th>종료시간</th>
            <!-- <th>메뉴</th> -->
        </tr>
                <!--합쳐질 열과행을 계산-->
            <tr>
                <td rowspan="2">달식당</td>
                <td rowspan="2">10:00</td>
                <td rowspan="2">21:00</td>
                <td >돈가스</td>
             
            </tr>
            <tr>
            <!--합쳐진 열과 행을 제외하고 남겨질 내용만 기입-->
            <!-- <td>달식당</td> -->
            <!-- <td>10:00</td> -->
            <!-- <td >21:00</td> -->
            <td >김밥</td>
            <tr>
                        <tr>
                <td rowspan="2">맘스터치</td>
                <td rowspan="2">11:00</td>
                <td rowspan="2">18:00</td>
                <td >햄버거</td>
             
            </tr>
            <tr>
                <!-- <td >맘스터치</td> -->
                <!-- <td >11:00</td> -->
                <!-- <td >18:00</td> -->
                <td >치킨</td>
            <tr>
<tr>
                        <tr>
                <td rowspan="2">김밥나라</td>
                <td rowspan="2">08:00</td>
                <td rowspan="2">20:00</td>
                <td >떡볶이</td>
             
            </tr>
            <tr>
                <!-- <td >김밥나라</td> -->
                <!-- <td >08:00</td> -->
                <!-- <td >20:00</td> -->
                <td >비빔밥</td>
            </tr>
        </tr>
        </table>
</body>
</html>

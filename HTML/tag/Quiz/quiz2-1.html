<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--퀴즈 제출하지 못했음
    input, select, fieldset, textarea, butten명령어 숙지 
    (답안지)-->
    <form action="">
    고객명 : <input type="text">
    <br><br>
    전화번호: <input type="tel">
    <br><br>
    E-mail: <input type="email">
    <br><br>
        <form action="">
                피자선택 : 
            <select>
                <option selected disabled >피자를 선택하시오</option>
                <option>치즈피자</option>
                <option>페페로니 피자</option>
                <option>콤비네이션 피자</option>
            </select>
                  <br>
    <fieldset><!--방법은 많고 다르다label은 글자를 같이 선택할 수 있다.-->
        <legend>피자 사이즈</legend>
        <input type="radio" name="pz_size">Small</label> <br>
        <input type="radio" name="pz_size">Medium</label><br>
        <label><input type="radio" name="pz_size">Large</label><br>
    </fieldset>
        <fieldset>
        <legend>토핑 선택</legend>
        <label><input type="checkbox" >베이컨</label></label><br>
        <label><input type="checkbox" >치즈</label></label><br>
        <label><input type="checkbox" >양파</label></label><br>
        <label><input type="checkbox" >버섯</label></label><br>
    </fieldset>
            <br>
            희망배송시간 : <input type="time"><br>
            배송시 요청사항 : <textarea name="" id=""></textarea><br><br>
            <button>주문하기</button>
            
            
    </form>
</body>
</html>

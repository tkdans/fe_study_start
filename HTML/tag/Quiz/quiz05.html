<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
        border:1px solid black;
        border-collapse: collapse;
        }
        </style>
</head>
<body>
    <form>
        <h1>나의 점심 취향 설문 조사 </h1>
        이름 : <input type="text">
        <fieldset> <!--맞음-->
        <legend>학년 선택</legend> <!--맞음-->
        <table><!--맞음-->
            <tr>
                <th>번호</th>
                <th>학년</th>
                <th>선택</th>
            </tr>
            <tr><!--맞음-->
            <td>1</td>
            <td>1학년</td>
            <td> <input type="radio" name="size"></td>
            <!--하나만 선택을 하려면 name의 속성값을 동일한 값을 주면 된다. 속성값이 같아야 뭉친다.
            "grade"라는 단어로 통일해도 된다-->
            </tr>
            <tr>
            <td>2</td>
            <td>2학년</td>
            <td> <input type="radio" name="size"></td>
            </tr>
            <tr>
            <td>3</td>
            <td>3학년</td>
            <td> <input type="radio" name="size"></td>
            </tr>
            <tr>
            <td>4</td>
            <td>4학년</td>
            <td> <input type="radio" name="size"></td>
            </tr>
        </table>
            
        </fieldset>
        <fieldset><!--맞음-->
        <legend>좋아하는 음식 (복수선택가능)</legend><!--맞음-->
        <!--labal로 감싸줘서 글씨를 눌러도 선택되게 한다.-->    
        <!--label--><input type="checkbox">한식 <br><!--/label-->
<!--label--><input type="checkbox">중식 <br><!--/label-->
<!--label--><input type="checkbox">일식 <br><!--/label-->
<!--label--><input type="checkbox">양식 <br><!--/label-->
<!--label--><input type="checkbox">분식 <br><!--/label-->
        </fieldset>
        <br>
        <br>
        <!--제출하기 type="submit" 태그를 사용하여 실제 적용할 수 있게 해야 한다. -->
        <button type="submit">제출하기</button>
</body>
</html>

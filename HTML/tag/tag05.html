<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=p, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--의미를 내포해서 강조(페이지 의미분석
    웹접근성
    중요한 의미 생각)-->
    <p>여기는 위험하니 <strong>절대로</strong> 지나가지 마세요</p>
    <p>커피는 꼭 <em>미리 주문</em> 해야합니다.</p>
    <br>
    <!--시각적으로만 강조-->
       <p>여기는 위험하니 <b>절대로</b> 지나가지 마세요</p>
    <p>커피는 꼭 <i>미리 주문</i> 해야합니다.</p>
</body>
</html>
